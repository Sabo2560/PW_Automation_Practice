name: PW · Async & Overlay UI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_playwright-run.yml
    with:
      suite-name: async-ui
      test-paths: tests/components/alert tests/components/calendar tests/components/wait tests/components/window tests/components/upload-file
      shards: '[1,2,3,4]'
      shard-total: 4
