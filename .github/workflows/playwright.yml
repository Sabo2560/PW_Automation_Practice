    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browser binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run calendar/wait/window suite
      run: npx playwright test tests/components/calendar tests/components/wait tests/components/window --project=${{ matrix.browser }} --workers=2
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-calendar-wait-window-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30

  # alert (6) + upload-file (8)
  alert-upload:
    name: alert-upload
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Cache Playwright browser binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright Browsers
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
