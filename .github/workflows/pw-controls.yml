name: PW · Controls & Interactions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_playwright-run.yml
    with:
      suite-name: controls
      test-paths: tests/components/button tests/components/slider tests/components/drag tests/components/drag-and-drop
      shards: '[1,2,3]'
      shard-total: 3
