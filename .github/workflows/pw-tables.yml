name: PW · Tables & Navigation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_playwright-run.yml
    with:
      suite-name: tables
      test-paths: tests/components/advanced-table tests/components/simple-table tests/components/components-listing
      shards: '[1,2]'
      shard-total: 2
