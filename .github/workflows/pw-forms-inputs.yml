name: PW · Forms & Inputs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_playwright-run.yml
    with:
      suite-name: forms-inputs
      test-paths: tests/components/form tests/components/input tests/components/dropdown tests/components/multiselect tests/components/radio
      shards: '[1,2,3]'
      shard-total: 3
