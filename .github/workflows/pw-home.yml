name: PW · Home & Seed

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily at 06:00 UTC (GitHub cron is always UTC).
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_playwright-run.yml
    with:
      suite-name: home
      test-paths: tests/home tests/seed.spec.ts
      shards: '[1]'
      shard-total: 1
