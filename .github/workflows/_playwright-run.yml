name: Playwright run (reusable)

# Reusable engine shared by every per-area workflow (pw-*.yml).
# It owns the boilerplate that used to be copy-pasted: checkout, npm ci,
# browser install (with the WebKit --with-deps + retry guardrail), the
# browser x shard fan-out, and merging every shard's blob report back into
# one HTML report per suite.

on:
  workflow_call:
    inputs:
      suite-name:
        description: Short slug for this area, used in job names and artifact names.
        required: true
        type: string
      test-paths:
        description: Space-separated test paths/globs passed straight to `playwright test`.
        required: true
        type: string
      shards:
        description: JSON array of shard indexes, e.g. '[1,2,3]'. Must match shard-total.
        required: false
        default: '[1]'
        type: string
      shard-total:
        description: Denominator of --shard=<n>/<total>. Keep in sync with `shards`.
        required: false
        default: 1
        type: number
      workers:
        description: Playwright workers per shard job.
        required: false
        default: 2
        type: number

jobs:
  test:
    name: ${{ inputs.suite-name }} · ${{ matrix.browser }} · shard ${{ matrix.shard }}/${{ inputs.shard-total }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Caches the downloaded browser binaries so a cache hit skips re-downloading them.
      # (OS-level apt packages that --with-deps installs can't persist -- fresh VM each run.)
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # --with-deps is required for WebKit specifically -- ubuntu-latest doesn't ship its
      # GTK4/GStreamer/flite libraries, and dropping this flag once broke every WebKit test
      # in CI (~30 missing .so files). --with-deps shells out to `apt-get update`, which
      # occasionally hangs on a degraded Ubuntu mirror, so it's wrapped in a retry instead
      # of riding out the full job timeout. Only the matrix browser is installed per job.
      - name: Install Playwright browser (${{ matrix.browser }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: >
          npx playwright test ${{ inputs.test-paths }}
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}/${{ inputs.shard-total }}
          --workers=${{ inputs.workers }}
          --reporter=github,blob
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ inputs.suite-name }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge-report:
    name: ${{ inputs.suite-name }} · merged HTML report
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download all blob reports for this suite
        uses: actions/download-artifact@v4
        with:
          pattern: blob-${{ inputs.suite-name }}-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge blobs into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.suite-name }}
          path: playwright-report/
          retention-days: 30
